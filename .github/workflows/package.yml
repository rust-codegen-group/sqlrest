name: Package
on:
  workflow_call:

permissions:
  contents: read

jobs:
  crate:
    name: Crates.io dry run
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: crate
      - run: just publish-dry-run

  release:
    name: Release binary
    # Keep the build compatible with the container's glibc 2.36.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release
      - run: just release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlrest-linux-x86_64
          path: target/release/sqlrest
          if-no-files-found: error
          retention-days: 7

  container:
    name: Container lifecycle
    needs: [release]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sqlrest-linux-x86_64
          path: target/release
      - name: Restore executable permission
        run: chmod +x target/release/sqlrest
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: 1.58.0
      - run: just container

[package]
name = "sqlrest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Typed SQL interfaces over HTTP"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
sqlparser = "0.59"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
turso = { version = "=0.8.0-pre.10", default-features = false }
turso_sdk_kit = { version = "=0.8.0-pre.10", default-features = false }
turso_core = { version = "=0.8.0-pre.10", default-features = false }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

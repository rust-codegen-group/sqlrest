[package]
name = "sqlrest"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Typed SQL interfaces over HTTP"
repository = "https://github.com/rust-codegen-group/sqlrest"
readme = "README.md"
keywords = ["sql", "rest", "database", "agent", "turso"]
categories = ["database", "web-programming::http-server"]
publish = ["crates-io"]

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
sqlparser = { version = "0.59", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
turso = { version = "=0.8.0-pre.10", default-features = false }
turso_sdk_kit = { version = "=0.8.0-pre.10", default-features = false }
turso_core = { version = "=0.8.0-pre.10", default-features = false }
url = "2"
percent-encoding = "2"
heck = "0.5"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
same-file = "1"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
aioduct = { version = "0.2.5", default-features = false, features = ["tokio", "json"] }
